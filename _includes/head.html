<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f9fc">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b1220">
<script>
  /* Apply saved/system theme before first paint to avoid flashing */
  (function () {
    try {
      var t = localStorage.getItem('theme');
      if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  })();
</script>
{%- if page.noindex %}
<meta name="robots" content="noindex, follow">
{%- endif %}
<meta name="keywords" content="{{ page.keywords | default: site.keywords | strip_newlines | strip }}">
<meta name="geo.region" content="KR-11">
<meta name="geo.placename" content="Seoul, Republic of Korea">
<meta name="format-detection" content="telephone=no">
