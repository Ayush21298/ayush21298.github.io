# Build settings
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

feed:
  posts_limit: 20

# Front-matter defaults: keep per-post front matter minimal and give every
# page a social share image out of the box.
defaults:
  - scope:
      path: ''
      type: posts
    values:
      layout: post
      author: Ayush Patel
      image: /images/og-image.png
  - scope:
      path: ''
    values:
      image: /images/og-image.png
  # Keep social redirect stubs and raw galleries out of the sitemap
  - scope:
      path: 'facebook.html'
    values: { sitemap: false }
  - scope:
      path: 'github.html'
    values: { sitemap: false }
  - scope:
      path: 'gitlab.html'
    values: { sitemap: false }
  - scope:
      path: 'instagram.html'
    values: { sitemap: false }
  - scope:
      path: 'linkedin.html'
    values: { sitemap: false }
  - scope:
      path: 'twitter.html'
    values: { sitemap: false }
  - scope:
      path: 'images/poc'
    values: { sitemap: false }

sass:
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - BLOGGING.md
  - LICENSE
  - vendor/
  - node_modules/
